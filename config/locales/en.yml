# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  sessions:
    new:
      logo_alt: "Cybercat"
      product_name: "Spendout"
      tagline: "Spendout is a simple and secure way to manage your money."
      title: "Sign in"
      instructions: "We’ll email you a %{count}-character sign-in code."
      email_placeholder: "you@example.com"
      submit: "Email me a code"
    create:
      code_sent: "Check your email for your sign-in code."
      invalid_email: "Enter a valid email address."
      rate_limited: "Try again later."
    auth_codes:
      show:
        title: "Enter your sign-in code"
        instructions: "We sent a %{count}-character code to %{email_address}."
        code_placeholder: "123456"
        submit: "Sign in"
        use_another_email: "Use another email address"
      create:
        invalid_code: "Try another code."
        rate_limited:
          one: "Try again in 1 minute."
          other: "Try again in %{count} minutes."
        missing_email: "Enter your email address to sign in."

  authentication_mailer:
    sign_in_instructions:
      subject: "Your Spendout code is %{code}"
      introduction: "Your Spendout sign-in code is:"
      expiration:
        one: "This code expires in 1 minute and can only be used once."
        other: "This code expires in %{count} minutes and can only be used once."
      unrequested: "If you didn't request this code, you can ignore this email."
